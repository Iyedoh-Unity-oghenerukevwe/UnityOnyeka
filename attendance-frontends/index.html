<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="bootstrap.css">


    <link rel="stylesheet" href="font-awesome/css/all.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .navbar-brand {
            color: #fff !important;
            font-weight: bold;
            font-size: 20px;
        }

        .dashboard-container {
            min-height: 90vh;
            display: flex;
            align-items: center;
        }

        .card-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
        }

        .card-box:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.6);
        }

        .card-icon {
            font-size: 55px;
            margin-bottom: 20px;
            color: #b16cea;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
        }

        .text-muted {
            color: #ccc !important;
        }

        a.card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }
    </style>
</head>

<body>


    <nav class="navbar px-4">
        <span class="navbar-brand">
            <i class="fa-solid fa-bolt"></i> Attendance Dashboard
        </span>
    </nav>


    <div class="container-fluid dashboard-container">
        <div class="row g-4 px-4 w-100">


            <div class="col-md-4">
                <a href="add-students.html" class="card-link">
                    <div class="card-box">
                        <div class="card-icon">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <div class="card-title">Add Student</div>
                        <p class="text-muted">Register new students</p>
                    </div>
                </a>
            </div>


            <div class="col-md-4">
                <a href="edit-depts.html" class="card-link">
                    <div class="card-box">
                        <div class="card-icon">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <div class="card-title">Departments</div>
                        <p class="text-muted">Manage departments</p>
                    </div>
                </a>
            </div>


            <div class="col-md-4">
                <a href="edit-faculty.html" class="card-link">
                    <div class="card-box">
                        <div class="card-icon">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div class="card-title">Faculty</div>
                        <p class="text-muted">Manage faculty</p>
                    </div>
                </a>
            </div>

        </div>
    </div>
    <div class="row g-4 mb-5">

        <div class="col-md-4">
            <div class="card-box">
                <div class="card-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <h3 id="totalStudents">0</h3>
                <p>Total Students</p>
            </div>
        </div>


        <div class="col-md-4">
            <div class="card-box">
                <div class="card-icon">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <h3 id="presentStudents">0</h3>
                <p>Present Today</p>
            </div>
        </div>


        <div class="col-md-4">
            <div class="card-box">
                <div class="card-icon">
                    <i class="fa-solid fa-user-xmark"></i>
                </div>
                <h3 id="absentStudents">0</h3>
                <p>Absent Today</p>
            </div>
        </div>

    </div>
    <div class="card-box mt-5">

        <h4>
            <i class="fa-solid fa-calendar-check"></i>
            Attendance Records
        </h4>


        <div class="table-responsive">

            <table class="table table-dark table-hover mt-4">

                <thead>

                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Matric</th>
                        <th>Department</th>
                        <th>Level</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>

                </thead>


                <tbody id="attendanceTable">

                </tbody>


            </table>

        </div>


    </div>


    <script src="script.js"></script>
    <script src="bootstrap.bundle.js"></script>

</body>

</html>
