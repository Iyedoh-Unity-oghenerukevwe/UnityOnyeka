<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification</title>

    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="font-awesome/css/all.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .otp-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(12px);
            width: 350px;
        }

        .otp-inputs {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        .otp-inputs input {
            width: 45px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-primary {
            background: #b16cea;
            border: none;
        }

        .btn-primary:hover {
            background: #9d4edd;
        }
    </style>

</head>

<body>
    <nav class="navbar px-4">

        <a href="index.html" class="navbar-brand">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>

    </nav>



    <div class="otp-box">

        <h4><i class="fa-solid fa-lock"></i> Verify OTP</h4>

        <p>Enter the 6-digit code sent to you</p>

        <button class="btn btn-primary w-100 mb-3" onclick="requestOTP()">
            Generate OTP
        </button>

        <div class="otp-inputs">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
            <input maxlength="1">
        </div>

        <button class="btn btn-primary w-100" onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>

    <script>

        const API_URL = "https://your-backend.com"; // 🔥 CHANGE THIS

        const inputs = document.querySelectorAll(".otp-inputs input");


        // AUTO MOVE INPUT
        inputs.forEach((input, index) => {

            input.addEventListener("input", () => {

                if (input.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }

            });

            input.addEventListener("keydown", (e) => {

                if (e.key === "Backspace" && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }

            });

        });


        // REQUEST OTP FROM BACKEND
        async function requestOTP() {

            try {

                const response = await fetch(`${API_URL}/generate-otp`, {
                    method: "POST"
                });

                const data = await response.json();

                alert("OTP sent ✅");

            }
            catch (error) {
                alert("Error generating OTP");
            }

        }


        // VERIFY OTP
        async function verifyOTP() {

            let code = "";

            inputs.forEach(input => code += input.value);

            if (code.length !== 6) {
                alert("Enter complete OTP");
                return;
            }

            try {

                const response = await fetch(`${API_URL}/verify-otp`, {

                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ otp: code })

                });

                const data = await response.json();

                if (data.success) {
                    alert("Verified ✅");
                    window.location.href = "index.html";
                } else {
                    alert("Invalid OTP ❌");
                }

            }
            catch (error) {
                alert("Verification failed");
            }

        }

    </script>

</body>

</html>
